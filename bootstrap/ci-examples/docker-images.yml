name: Images

# Pull requests build and smoke-test the images only when packaging changes
# (Dockerfiles, container config, dependencies, the smoke stack): app code is
# covered by Backend CI, Frontend CI and End-to-end. Main builds and publishes
# on every app change, so each deployable commit gets its sha-<commit> tag.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/Dockerfile'
      - 'backend/.dockerignore'
      - 'backend/docker/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/Dockerfile'
      - 'frontend/.dockerignore'
      - 'frontend/docker/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'compose.smoke.yml'
      - '.github/workflows/images.yml'

  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '!backend/tests/**'
      - 'frontend/**'
      - '!frontend/test/**'
      - '!frontend/e2e/**'
      - 'compose.smoke.yml'
      - '.github/workflows/images.yml'

  workflow_dispatch:

permissions:
  contents: read

# On pull requests a newer push cancels the older run. On main, publishing is
# never cancelled midway; a run waiting behind it is replaced by a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: Build, smoke-test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    env:
      API_IMAGE: app-api:ci
      WEB_IMAGE: app-web:ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check that CI images avoid anonymous Docker Hub pulls
        # Docker Hub and the AWS public mirror rate-limit anonymous pulls from
        # shared runners. Official images come from Google's mirror; the
        # Dockerfile syntax directive is omitted because it pulls from Docker Hub.
        run: |
          if grep -nE '^FROM ' backend/Dockerfile frontend/Dockerfile \
            | grep -vE 'FROM (mirror\.gcr\.io|ghcr\.io)/'; then
            echo "::error::Use mirror.gcr.io/library/... for base images"; exit 1
          fi
          if grep -nE '^\s*image: ' compose.smoke.yml .github/workflows/*.yml \
            | grep -vE 'image: (mirror\.gcr\.io|ghcr\.io)/|image: \$\{'; then
            echo "::error::Use mirror.gcr.io/library/... for CI images"; exit 1
          fi
          if grep -n '^# syntax=' backend/Dockerfile frontend/Dockerfile; then
            echo "::error::The syntax directive pulls from Docker Hub"; exit 1
          fi
          if ! grep -q 'image=mirror.gcr.io/moby/buildkit' .github/workflows/images.yml; then
            echo "::error::Set the BuildKit image to the mirror"; exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The BuildKit image otherwise comes from Docker Hub; Google's
          # Docker Hub mirror serves the same image.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Pull the smoke-stack database image
        # Registries can briefly refuse anonymous pulls; retry with backoff.
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose -f compose.smoke.yml pull postgres && exit 0
            echo "Pull attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Start smoke stack
        run: docker compose -f compose.smoke.yml up --no-build --wait --wait-timeout 120

      - name: Smoke-test through the web image
        run: |
          curl -fsS http://127.0.0.1:8080/api/health/ready | grep -q '"database":"ok"'
          # A table-backed read proves the entrypoint applied the migrations.
          curl -fsS -o /dev/null http://127.0.0.1:8080/api/<a-table-backed-endpoint>
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          test "$(docker compose -f compose.smoke.yml exec -T api id -u)" != 0
          test "$(docker compose -f compose.smoke.yml exec -T web id -u)" != 0

      - name: Show container logs
        if: failure()
        run: docker compose -f compose.smoke.yml logs

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for name in api web; do
            remote="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY#*/}-$name"
            for tag in main "sha-${GITHUB_SHA::7}"; do
              docker tag "app-$name:ci" "$remote:$tag"
              docker push "$remote:$tag"
            done
          done
