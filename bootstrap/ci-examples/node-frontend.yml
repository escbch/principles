name: Frontend CI

# Runs only when the frontend or this workflow change; a backend contract
# change also touches frontend/src/api/openapi.json, so it runs then too.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'

  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, build, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated API types match the committed contract
        run: npm run api:check

      # Quick checks first, so a lint or type error fails before the long tests.
      - name: Run Oxlint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

      - name: Run tests
        run: npm run test
